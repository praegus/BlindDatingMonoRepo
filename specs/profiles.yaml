openapi: 3.0.1
info:
  title: Profile Service API
  description: 'Profile Service api definitie'
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /account/profile:
    put:
      tags: [account]
      operationId: ensureAccountProfile
      description: Create or load the current account's profile using the validated JWT subject and username.
      responses:
        "200":
          description: The current account's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        "401":
          description: Missing or invalid access token
        "403":
          description: Invalid account identity or profile owned by another account
  /profiles:
    get:
      security: []
      tags:
        - profiles
      operationId: getAllProfiles
      description: Public profile listing for unauthenticated backend service calls.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
    post:
      tags:
        - profiles
      operationId: createProfile
      deprecated: true
      description: Disabled. Use PUT /account/profile to provision the authenticated user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        "201":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        409:
          $ref: '#/components/responses/ConflictResponse'
        "403":
          description: Legacy arbitrary profile creation is disabled

    delete:
      tags:
        - profiles
      operationId: deleteProfiles
      description: Delete all profiles. Any authenticated caller with a valid profile-service-audience access token is permitted, regardless of profile ownership.
      responses:
        "401":
          description: Missing or invalid access token
        "204":
          description: All profiles deleted

  /profiles/{username}:
    get:
      security: []
      tags:
        - profiles
      operationId: getSingleProfile
      description: Public single-profile lookup for unauthenticated backend service calls.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        404:
          $ref: '#/components/responses/NotFoundResponse'
    put:
      tags:
        - profiles
      operationId: updateProfile
      description: Update the authenticated user's own profile. The path and body usernames must match the JWT identity.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - profiles
      operationId: deleteProfile
      description: Delete only the profile owned by the authenticated JWT subject and username.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictResponse:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          description: a URI identifier that categorizes the error
        title:
          type: string
          description: a brief, human-readable message about the error
        status:
          type: integer
          description: the HTTP response code (optional)
        detail:
          type: string
          description: a human-readable explanation of the error
        instance:
          type: string
          description: a URI that identifies the specific occurrence of the error
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: the field that the error is thrown on
        error:
          type: string
          description: the error message
    Profile:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[a-zA-Z0-9]*$"
        firstname:
          type: string
          maxLength: 20
        lastname:
          type: string
          maxLength: 20
        additionalInfo:
          type: string
          maxLength: 20
        address:
          $ref: '#/components/schemas/Address'
        personalInformation:
          $ref: '#/components/schemas/Characteristics'
        dislikes:
          $ref: '#/components/schemas/Characteristics'
        preferences:
          $ref: '#/components/schemas/Characteristics'
        dates:
          type: array
          items:
            $ref: '#/components/schemas/RomanticDate'

    Characteristics:
      type: object
      properties:
        gender:
          $ref: '#/components/schemas/Gender'
        favoriteColor:
          type: string
        pets:
          type: boolean
        hairColor:
          $ref: '#/components/schemas/HairColor'
        tattoos:
          type: boolean
        sports:
          type: string
        musicGenres:
          type: array
          items:
            $ref: '#/components/schemas/MusicGenre'

    Gender:
      type: string
      enum: [ MAN, WOMAN, X ]

    HairColor:
      type: string
      enum: [ BLOND, BROWN, BLACK, RED, NO, GRAY, PINK ]

    MusicGenre:
      type: string
      enum:
        - ROCK
        - METAL
        - DEATHMETAL
        - TRASHMETAL
        - BALLROOM
        - CLASSICAL
        - COUNTRY
        - DANCE
        - ELECTRONIC
        - FUNK
        - HIP_HOP
        - JAZZ
        - LATIN
        - POP
        - RB
        - REGGAE
        - UNKNOWN
        - WORLD

    RomanticDate:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        time:
          type: string
          format: date-time
        itemToBring:
          type: string

    Address:
      type: object
      properties:
        street:
          type: string
        streetNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        valid:
          type: boolean
        longitude:
          type: number
        latitude:
          type: number
