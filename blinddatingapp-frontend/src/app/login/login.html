<div class="login-container">
  <h1>Welcome to the BlindDatingApp</h1>
  <div class="button-group">
    @if (auth.authenticated()) {
      <a mat-raised-button routerLink="/profile">My profile</a>
      <button mat-button (click)="auth.logout()">Log out</button>
    } @else {
      <button mat-raised-button color="primary" (click)="signIn()" [disabled]="!!auth.error()">Login</button>
      <button mat-raised-button (click)="signIn(true)" [disabled]="!!auth.error()">Register</button>
    }
  </div>
  @if (error() || auth.error()) {
    <p role="alert">{{ error() || auth.error() }}</p>
  }
</div>
